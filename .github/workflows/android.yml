name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publier l'APK dans une release GitHub"
        type: boolean
        default: false
      emulator:
        description: "Lancer aussi les tests instrumentés sur émulateur"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYNET_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Afficher les erreurs Kotlin comme annotations
        run: echo "::add-matcher::.github/kotlin-problem-matcher.json"

      - name: Clé de signature durable (secret)
        env:
          KEYSTORE_B64: ${{ secrets.MYNET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MYNET_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature durable disponible."
          else
            echo "::warning::Aucun secret MYNET_KEYSTORE_B64 : l'APK release ne sera pas signé."
          fi

      - name: Tests unitaires
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Compiler l'APK
        env:
          MYNET_KEYSTORE_PASSWORD: ${{ secrets.MYNET_KEYSTORE_PASSWORD }}
          MYNET_KEY_ALIAS: ${{ secrets.MYNET_KEY_ALIAS }}
          MYNET_KEY_PASSWORD: ${{ secrets.MYNET_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Vérifier la signature et calculer le SHA-256
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee apksigner.txt
          "$BT/aapt2" dump badging "$APK" | head -3
          NAME="my-networks-0.1.0-${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          CERT=$(grep -m1 "SHA-256 digest" apksigner.txt | sed 's/.*: //')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK::$NAME sha256=$SHA cert=$CERT"
          # Aucune permission INTERNET ne doit apparaître.
          if "$BT/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::La permission INTERNET est présente dans l'APK"; exit 1
          fi
          "$BT/aapt2" dump permissions "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Résumé des erreurs (si échec)
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^(e: |error:|ERROR|FAILURE|What went wrong|> )|Exception|\.kt:[0-9]+" build.log | grep -v "^w: " | head -60 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi

      - name: Publier la release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-build.${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "My Networks 0.1.0 (build ${{ github.run_number }})" \
            --notes "APK signé. SHA-256 : ${{ steps.apk.outputs.sha }}"

  emulator-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests instrumentés + captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || (echo "::error::tests instrumentés en échec" && exit 1)
            mkdir -p ci-output && adb pull /sdcard/Android/media/ch.m4rm0tt.mynetworks/ci ci-output/ || true
      - name: Publier les captures et mesures sur la branche ci-artifacts
        if: always()
        run: |
          if [ -d ci-output ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin ci-artifacts || true
            if git show-ref --verify --quiet refs/remotes/origin/ci-artifacts; then
              git checkout -B ci-artifacts origin/ci-artifacts
            else
              git checkout --orphan ci-artifacts && git rm -rf . > /dev/null
            fi
            mkdir -p "run-${{ github.run_number }}"
            cp -r ci-output/* "run-${{ github.run_number }}/" || true
            find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} "run-${{ github.run_number }}/" \; 2>/dev/null || true
            git add "run-${{ github.run_number }}"
            git commit -m "ci: captures et mesures du run ${{ github.run_number }}" || exit 0
            git push origin ci-artifacts
          fi
